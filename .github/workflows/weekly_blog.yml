name: Falowen Ecosystem Blog Calendar

on:
  schedule:
    # Tuesday / Friday at 09:00 in Ghana (UTC+0), during the dated pilot.
    - cron: "0 9 * * 2,5"
  workflow_dispatch:
    inputs:
      post_date:
        description: "Optional YYYY-MM-DD from the marketing calendar"
        required: false
        type: string
      dry_run:
        description: "Preview the scheduled post without committing or publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: falowen-ecosystem-blog-publish
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate campaign dates and image paths
        run: python -m unittest tests.test_ecosystem_post

      - name: Generate scheduled illustrated article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REQUESTED_DATE: ${{ inputs.post_date }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$REQUESTED_DATE" ]; then
            args+=(--date "$REQUESTED_DATE")
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "false" ]; then
            args+=(--dry-run)
          fi
          python scripts/generate_ecosystem_post.py "${args[@]}"

      - name: Commit and push new article
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- _posts)" ]; then
            echo "No new post to commit."
            exit 0
          fi

          git config user.name "falowen-bot"
          git config user.email "falowen-bot@users.noreply.github.com"
          git add _posts
          git commit -m "chore(blog): publish next ecosystem article"
          git pull --rebase origin main
          git push origin HEAD:main
