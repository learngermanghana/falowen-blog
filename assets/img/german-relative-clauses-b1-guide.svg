<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">German Relative Clauses B1 Guide</title><desc id="desc">Falowen learning graphic explaining German relative pronouns der, die, das and word order.</desc><rect width="1600" height="900" fill="#f8fafc"/><rect x="90" y="90" width="1420" height="720" rx="44" fill="#fff" stroke="#e2e8f0" stroke-width="4"/><text x="150" y="205" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#ea580c">FALOWEN · GERMAN B1</text><text x="150" y="320" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#0f172a">German Relative Clauses</text><text x="150" y="390" font-family="Arial,sans-serif" font-size="34" fill="#475569">Relativsätze with der, die, das · Easy word order</text><rect x="150" y="475" width="370" height="125" rx="28" fill="#f1f5f9"/><text x="335" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#0f172a">der</text><rect x="570" y="475" width="370" height="125" rx="28" fill="#f1f5f9"/><text x="755" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#0f172a">die</text><rect x="990" y="475" width="370" height="125" rx="28" fill="#f1f5f9"/><text x="1175" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#0f172a">das</text><text x="150" y="700" font-family="Arial,sans-serif" font-size="37" fill="#334155">Das ist der Mann, der in Berlin wohnt.</text><text x="150" y="755" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#ea580c">Relative clause → verb goes to the end</text></svg>