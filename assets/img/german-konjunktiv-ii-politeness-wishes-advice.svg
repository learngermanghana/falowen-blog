<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">German Konjunktiv II polite requests guide</title>
  <desc id="desc">Falowen German grammar illustration showing würde, könnte, wäre and hätte with practical polite German examples.</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="70" y="70" width="1460" height="760" rx="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="130" y="165" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ea580c">FALOWEN · GERMAN GRAMMAR</text>
  <text x="130" y="275" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#0f172a">German Konjunktiv II</text>
  <text x="130" y="345" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#475569">Polite requests, wishes &amp; advice made practical</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="130" y="425" width="290" height="130" rx="28" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
    <text x="275" y="505" font-size="44" fill="#9a3412">würde</text>
    <rect x="455" y="425" width="290" height="130" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="600" y="505" font-size="44" fill="#0f172a">könnte</text>
    <rect x="780" y="425" width="290" height="130" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="925" y="505" font-size="44" fill="#0f172a">wäre</text>
    <rect x="1105" y="425" width="290" height="130" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="1250" y="505" font-size="44" fill="#0f172a">hätte</text>
  </g>
  <text x="130" y="655" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#0f172a">Könnten Sie mir bitte helfen?</text>
  <text x="130" y="710" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#475569">Learn natural German for real conversations · A2–B2</text>
  <rect x="130" y="755" width="340" height="8" rx="4" fill="#f97316"/>
</svg>